<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Akira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Your Akira server's address, e.g. https://akira.yoursite.com . Visitors can also set it in Settings → Intelligence. -->
<meta name="akira-server" content="">
<style>
/* Layout: floating Liquid Glass sidebar + toolbar over a content layer; Workspace adds a context inspector. Akira is green, Workspace is indigo. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --gray:#8E8E93; --gray2:#AEAEB2; --gray3:#C7C7CC; --gray4:#D1D1D6; --gray5:#E5E5EA; --gray6:#F2F2F7;
  --bg: var(--gray6);
  --surface:#FFFFFF;
  --label:#1C1C1E;
  --label-2:rgba(60,60,67,.66);
  --label-3:rgba(60,60,67,.42);
  --separator:rgba(60,60,67,.16);
  --fill:rgba(120,120,128,.12);
  --fill-strong:rgba(120,120,128,.2);
  --green:#248A3D;  --green-soft:rgba(52,199,89,.14);
  --indigo:#4B49C7; --indigo-soft:rgba(88,86,214,.13);
  --orange:#C55300; --orange-soft:rgba(255,149,0,.16);
  --red:#D70015; --red-soft:rgba(255,59,48,.12);
  --glass:rgba(255,255,255,.62);
  --glass-edge:rgba(255,255,255,.75);
  --glass-shadow:0 8px 30px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --dim:rgba(0,0,0,.28);
  --ambient-a:rgba(52,199,89,.10);
  --ambient-b:rgba(88,86,214,.08);
  --tint: var(--green); --tint-soft: var(--green-soft);
  --bg-work:#EEEEF4; --grid-dot:rgba(88,86,214,.13);
  --r-lg:22px; --r-md:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --gray:#8E8E93; --gray2:#636366; --gray3:#48484A; --gray4:#3A3A3C; --gray5:#2C2C2E; --gray6:#1C1C1E;
  --bg:#000000; --surface:#1C1C1E;
  --label:#F5F5F7; --label-2:rgba(235,235,245,.64); --label-3:rgba(235,235,245,.38);
  --separator:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.34);
  --green:#30D158; --green-soft:rgba(48,209,88,.16);
  --indigo:#7D7AFF; --indigo-soft:rgba(94,92,230,.22);
  --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.16); --red:#FF453A; --red-soft:rgba(255,69,58,.16);
  --glass:rgba(38,38,42,.58); --glass-edge:rgba(255,255,255,.10);
  --glass-shadow:0 10px 34px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
  --dim:rgba(0,0,0,.55); --ambient-a:rgba(48,209,88,.09); --ambient-b:rgba(94,92,230,.14);
  --bg-work:#0B0B12; --grid-dot:rgba(125,122,255,.14);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --gray:#8E8E93; --gray2:#636366; --gray3:#48484A; --gray4:#3A3A3C; --gray5:#2C2C2E; --gray6:#1C1C1E;
  --bg:#000000; --surface:#1C1C1E;
  --label:#F5F5F7; --label-2:rgba(235,235,245,.64); --label-3:rgba(235,235,245,.38);
  --separator:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.34);
  --green:#30D158; --green-soft:rgba(48,209,88,.16);
  --indigo:#7D7AFF; --indigo-soft:rgba(94,92,230,.22);
  --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.16); --red:#FF453A; --red-soft:rgba(255,69,58,.16);
  --glass:rgba(38,38,42,.58); --glass-edge:rgba(255,255,255,.10);
  --glass-shadow:0 10px 34px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
  --dim:rgba(0,0,0,.55); --ambient-a:rgba(48,209,88,.09); --ambient-b:rgba(94,92,230,.14);
  --bg-work:#0B0B12; --grid-dot:rgba(125,122,255,.14);
  color-scheme:dark;
}
@media (prefers-contrast: more){
  :root{ --gray:#6C6C70; --gray2:#8E8E93; --gray3:#AEAEB2; --gray4:#BCBCC0; --gray5:#D8D8DC; --gray6:#EBEBF0;
    --label-2:rgba(60,60,67,.85); --label-3:rgba(60,60,67,.7); --separator:rgba(60,60,67,.4); --glass:rgba(255,255,255,.94); }
}
@media (prefers-reduced-transparency: reduce){ :root{ --glass: var(--surface); } }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:-0.012em;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb, var(--tint) 55%, transparent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:grid;grid-template-columns:292px minmax(0,1fr) auto;position:relative;
  background:radial-gradient(1200px 600px at 85% -10%, var(--ambient-a), transparent 60%), radial-gradient(900px 500px at 10% 110%, var(--ambient-b), transparent 60%), var(--bg)}
.app[data-space="workspace"]{--tint:var(--indigo);--tint-soft:var(--indigo-soft);
  background:radial-gradient(1100px 520px at 70% -12%, var(--ambient-b), transparent 60%), radial-gradient(var(--grid-dot) 1px, transparent 1.2px) 0 0/22px 22px, var(--bg-work)}
.app[data-space="workspace"] .view{max-width:960px}
.app[data-space="workspace"] .sidebar{border-top:3px solid var(--indigo)}
.app[data-space="akira"] .sidebar{border-top:3px solid var(--green)}
.app[data-space="akira"] .msg.user .bubble{border-radius:20px 20px 6px 20px}
.space-tag{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--tint);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex:none;transition:background .3s}
.space-tag svg{width:14px;height:14px;stroke-width:2}
.app.switching .main{animation:swap .35s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}

/* Sidebar */
.sidebar{margin:10px 0 10px max(10px, env(safe-area-inset-left,0px));border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:0;z-index:30}
.sb-top{padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
.mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tint);color:#fff;transition:background .3s}
.mark svg{width:16px;height:16px;stroke-width:2}
.brand b{display:block;font-family:var(--font-display);font-size:17px;font-weight:650;letter-spacing:-0.02em}
.brand small{display:block;font-size:12px;color:var(--label-2);margin-top:-2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px}
.seg button{height:30px;border-radius:8px;font-size:13px;font-weight:550;color:var(--label-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{color:var(--label);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button svg{width:15px;height:15px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:var(--fill);color:var(--label-2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;color:var(--label)}
.search input::placeholder{color:var(--label-3)}
.new-row{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--tint)}
.new-row:hover{background:var(--tint-soft)}
.sb-list{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
.sb-section{font-size:12px;font-weight:600;color:var(--label-3);padding:10px 10px 6px;letter-spacing:.02em}
.sb-empty{font-size:13px;color:var(--label-3);padding:6px 10px;line-height:1.4}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;transition:background .15s}
.row:hover{background:var(--fill)}
.row[aria-current="true"]{background:var(--tint-soft)}
.row[aria-current="true"] .row-title{color:var(--tint)}
.row-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--label-2);flex:none}
.row-ic.proj{color:#fff;font-weight:650;font-size:13px}
.row-body{display:block;min-width:0;flex:1}
.row-title{display:block;font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:block;font-size:12.5px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:11.5px;color:var(--label-3);font-variant-numeric:tabular-nums;align-self:flex-start;padding-top:2px;white-space:nowrap;flex:none}
.sb-foot{border-top:1px solid var(--separator);padding:8px;display:flex;flex-direction:column;gap:2px}
.sb-foot .row-ic{background:none}
.saved{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--label-3);padding:4px 10px 2px}
.saved svg{width:13px;height:13px}

/* Main */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.toolbar{position:absolute;top:10px;left:12px;right:12px;z-index:20;display:flex;align-items:center;gap:10px;pointer-events:none}
.toolbar > *{pointer-events:auto}
.capsule{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.icon-btn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--label);transition:background .15s}
.icon-btn:hover{background:var(--fill)}
.icon-btn[aria-pressed="true"]{color:var(--tint);background:var(--tint-soft)}
.tb-title{min-width:0;padding:6px 16px;border-radius:999px}
.tb-title b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{display:block;font-size:12px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.only-narrow{display:none}
.edge{position:absolute;top:0;left:0;right:0;height:78px;z-index:10;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 35%, transparent);mask-image:linear-gradient(#000 35%, transparent)}
.scroll{flex:1;overflow:auto;min-height:0}
.view{max-width:780px;margin:0 auto;padding:80px max(20px, env(safe-area-inset-right,0px)) 170px max(20px, env(safe-area-inset-left,0px))}

/* Home / empty states */
.hello{padding:12vh 0 8px}
.hello h1{font-family:var(--font-display);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-0.025em;text-wrap:balance;margin:0}
.hello p{color:var(--label-2);margin:8px 0 0;font-size:16px;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--separator);font-size:13.5px;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--tint);color:var(--tint)}
.chip svg{width:15px;height:15px;color:var(--tint)}
.empty{text-align:center;padding:40px 16px;color:var(--label-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--label);font-size:16px}
.empty p{margin:0;max-width:44ch;font-size:14px}

/* Thread */
.thread{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.msg{display:flex;gap:12px;max-width:100%}
.msg.user{justify-content:flex-end}
.bubble{background:var(--tint);color:#fff;padding:10px 14px;border-radius:20px 20px 6px 20px;max-width:min(560px, 85%);white-space:pre-wrap;overflow-wrap:anywhere}
.app[data-space="workspace"] .bubble{background:var(--surface);color:var(--label);border:1px solid var(--separator)}
.av{width:28px;height:28px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none;margin-top:2px}
.av svg{width:15px;height:15px;stroke-width:2}
.reply{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
.who{font-size:12.5px;font-weight:600;color:var(--label-2)}
.md{overflow-wrap:anywhere;max-width:66ch}
.md > *{margin:0 0 10px}
.md > *:last-child{margin-bottom:0}
.md h3,.md h4{font-size:15.5px;font-weight:650;margin-top:14px}
.md ul,.md ol{padding-left:22px}
.md li{margin:3px 0}
.md code{font-family:var(--font-mono);font-size:.88em;background:var(--fill);padding:1px 5px;border-radius:5px}
.md pre{background:var(--fill);padding:12px;border-radius:10px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md a{color:var(--tint)}
.md blockquote{border-left:3px solid var(--separator);padding-left:12px;color:var(--label-2)}
.err{color:var(--red);font-size:13.5px}
.typing{display:flex;gap:4px;padding:8px 0;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--label-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--label-2);flex-wrap:wrap}
.note svg{width:14px;height:14px;color:var(--tint)}
.note.gone{text-decoration:line-through;opacity:.6}
.link{color:var(--tint);font-weight:550}
.link:hover{text-decoration:underline}
.cite{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:6px;background:var(--tint-soft);color:var(--tint);font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;vertical-align:1px}

/* Buttons & fields */
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:32px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--fill);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--fill-strong)}
.btn.primary{background:var(--tint);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:12.5px;font-weight:600;color:var(--label-2)}
.input{width:100%;border:1px solid var(--separator);background:var(--surface);border-radius:10px;padding:9px 12px;outline:none;font-size:14.5px}
.input:focus{border-color:var(--tint);box-shadow:0 0 0 3px var(--tint-soft)}
textarea.input{resize:vertical;min-height:80px;line-height:1.45}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.sw[aria-checked="true"]{border-color:var(--label)}

/* Composer */
.composer-wrap{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));pointer-events:none}
.composer{pointer-events:auto;max-width:780px;margin:0 auto;border-radius:26px;padding:8px 8px 8px 16px;display:flex;flex-direction:column;gap:6px}
.composer-row{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-width:0;border:0;outline:none;background:none;resize:none;padding:7px 0;max-height:160px;font-size:15px;line-height:1.4}
.composer textarea::placeholder{color:var(--label-3)}
.send{width:36px;height:36px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.send svg{stroke-width:2.2}
.send .sq{width:12px;height:12px;border-radius:3px;background:#fff}
.scope{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--tint-soft);color:var(--tint);font-size:12px;font-weight:600}
.pill svg{width:13px;height:13px}
.scope small{font-size:12px;color:var(--label-3)}
.banner{font-size:12.5px;color:var(--orange);padding:0 2px}

/* Workspace */
.proj-head{padding:22px 0 14px;display:flex;gap:16px;align-items:flex-start}
.proj-badge{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:24px;flex:none}
.proj-head h1{font-family:var(--font-display);font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-0.024em;margin:2px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.proj-head p{margin:0;color:var(--label-2);max-width:60ch}
.proj-head > div{min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--tint);letter-spacing:.02em}
.tabs{display:flex;gap:2px;background:var(--fill);padding:2px;border-radius:10px;overflow-x:auto;scrollbar-width:none;margin:6px 0 20px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:30px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:550;color:var(--label-2);white-space:nowrap;flex:1}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .n{color:var(--label-3);font-variant-numeric:tabular-nums;margin-left:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--separator);border-radius:var(--r-md);padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--label-2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel.wide{grid-column:1/-1}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.stat span{font-size:12px;color:var(--label-2)}
.muted{color:var(--label-2);font-size:13.5px;margin:0}
.stamp{font-size:12px;color:var(--label-3);font-weight:450}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--separator);min-width:0}
.li:first-child{border-top:0}
.li.click{cursor:pointer;border-radius:8px}
.li.click:hover{background:var(--fill)}
.li-body{flex:1;min-width:0}
.li-title{font-size:14px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-sub{font-size:12.5px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-meta{font-size:12px;color:var(--label-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--label-3);flex:none}
.x:hover{background:var(--red-soft);color:var(--red)}
.x svg{width:15px;height:15px}
.file-ic{width:30px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.04em;color:#fff;flex:none;background:var(--tint)}
.check{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--gray2);display:grid;place-items:center;flex:none}
.check svg{width:13px;height:13px;stroke:#fff;stroke-width:2.6;opacity:0}
.check[aria-checked="true"]{background:var(--tint);border-color:var(--tint)}
.check[aria-checked="true"] svg{opacity:1}
.li.is-done .li-title{color:var(--label-3);text-decoration:line-through}

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const ic = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const COLORS = ['#4B49C7','#248A3D','#C55300','#D70015','#007AFF','#AF52DE','#8E8E93'];
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1).trim() + '…' : s;

function when(ts){
  if (!ts) return '';
  const d = new Date(ts), t = new Date();
  const days = Math.floor((new Date(t.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (days === 0) return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if (days === 1) return 'Yesterday';
  if (days < 7) return d.toLocaleDateString([], {weekday:'short'});
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}
function dueLabel(s){
  if (!s) return '';
  const d = new Date(s + 'T00:00'), t = new Date(new Date().toDateString());
  const diff = Math.round((d - t) / 864e5);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff < 0) return 'Overdue';
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}
const words = s => (s.trim().match(/\S+/g) || []).length;

/* Small, safe Markdown renderer */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\[S(\d+)\]/g, '<span class="cite">S$1</span>');
  return s;
}
function md(src){
  const lines = String(src || '').replace(/\r/g,'').split('\n');
  let out = '', para = [], list = null, code = null;
  const flushP = () => { if (para.length){ out += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const flushL = () => { if (list){ out += `<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.t}>`; list = null; } };
  for (const line of lines){
    if (code !== null){
      if (/^```/.test(line)){ out += `<pre><button class="copy" data-act="copy">Copy</button><code>${esc(code.join('\n'))}</code></pre>`; code = null; } else code.push(line);
      continue;
    }
    if (/^```/.test(line)){ flushP(); flushL(); code = []; continue; }
    let m;
    if (!line.trim()){ flushP(); flushL(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)/))){ flushP(); flushL(); out += `<h3>${inline(m[1])}</h3>`; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if (!list || list.t !== 'ul'){ flushL(); list = {t:'ul', items:[]}; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if (!list || list.t !== 'ol'){ flushL(); list = {t:'ol', items:[]}; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^>\s?(.*)/))){ flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    flushL(); para.push(line.trim());
  }
  if (code !== null) out += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
  flushP(); flushL();
  return out;
}

/* Arc: render SVG concepts as images (an <img> never runs scripts) */
function arcify(content){
  const svgs = [];
  let c = String(content || '').replace(/```svg\s*([\s\S]*?)```/g, (m, s) => { svgs.push(s); return `\n\n@@ARC${svgs.length-1}@@\n\n`; });
  c = c.replace(/(<svg[\s\S]*?<\/svg>)/g, m => { svgs.push(m); return `\n\n@@ARC${svgs.length-1}@@\n\n`; });
  let pending = false;
  const k = c.search(/```svg|<svg/);
  if (k >= 0){ c = c.slice(0, k); pending = true; }
  let html = md(c).replace(/<p>@@ARC(\d+)@@<\/p>/g, (m, i) => arcCard(svgs[+i]));
  if (pending) html += `<div class="arc-card drawing">${ic('image')}Arc is drawing…</div>`;
  return html;
}
function arcCard(svg){
  let s = String(svg || '').trim();
  if (!/^<svg[\s\S]*<\/svg>$/i.test(s)) return '';
  if (!/xmlns=/.test(s)) s = s.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  return `<figure class="arc-card"><img src="${src}" alt="Image made by Arc"><figcaption>${ic('image')}Arc · vector image${downloads ? '<button class="link" data-act="dlSvg">Download</button>' : ''}</figcaption></figure>`;
}

/* ============ Akira server connector ============
   When this page isn't running on claude.ai, cloud work goes to an Akira server
   (python3 -m akira.server). The connector behaves like the claude.ai `sample`
   function, so the rest of the page works the same either way. */
const serverURL = () => ((S.profile.prefs && S.profile.prefs.server) || (document.querySelector('meta[name="akira-server"]') || {}).content || '').trim().replace(/\/+$/, '');
const RANK = { Standard:'0', Lite:'0', Pro:'1', General:'1', Ultra:'2', Max:'2', quick:'0', default:'1', complex:'2' };
let backend = null;   // 'claude' | 'akira' | null

function pngsToSvg(pngs){
  const n = pngs.length, cols = n > 1 ? 2 : 1, size = 128, rows = Math.ceil(n / cols);
  const cells = pngs.map((d, i) => `<image href="data:image/png;base64,${d}" x="${(i % cols) * (size + 4)}" y="${Math.floor(i / cols) * (size + 4)}" width="${size}" height="${size}"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${cols * (size + 4) - 4} ${rows * (size + 4) - 4}">${cells}</svg>`;
}

function akiraServer(base){
  const err = (code, message, text) => ({ code, message, ...(text ? { text } : {}) });
  async function call(input, opts = {}){
    if (opts.tools && opts.tools.length) throw err('tools_unavailable', 'The Akira server runs its own tools.');
    const turns = typeof input === 'string' ? [{ role:'user', content:input }] : input.map(t => ({ role:t.role, content:String(t.content) }));
    const hint = opts.akira || {};
    const body = { messages:turns, stream:true, family:hint.family || 'auto', tier:RANK[hint.tier] || RANK[opts.modelTier] || 'auto' };
    let res, text = '', pngs = [];
    try {
      res = await fetch(base + '/v1/chat', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body), signal:opts.signal });
    } catch (e) {
      throw e && e.name === 'AbortError' ? err('cancelled', 'Stopped.') : err('upstream_error', 'The Akira server could not be reached.');
    }
    if (!res.ok){
      const code = { 429:'rate_limited', 401:'not_granted', 413:'prompt_too_large' }[res.status] || 'upstream_error';
      throw err(code, 'Akira server returned ' + res.status);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    const emit = delta => { text += delta; opts.onText && opts.onText({ text, delta }); };
    try {
      for (;;){
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const parts = buf.split('\n\n'); buf = parts.pop();
        for (const part of parts){
          if (!part.startsWith('data: ')) continue;
          let ev; try { ev = JSON.parse(part.slice(6)); } catch { continue; }
          if (ev.type === 'text' && ev.text) emit(ev.text);
          else if (ev.type === 'image') pngs.push(ev.data);
          else if (ev.type === 'error') throw err('upstream_error', ev.message, text);
        }
      }
    } catch (e) {
      if (e && e.code) throw e;
      throw e && e.name === 'AbortError' ? err('cancelled', 'Stopped.', text) : err('upstream_error', 'The connection dropped.', text);
    }
    if (pngs.length) emit('\n\n```svg\n' + pngsToSvg(pngs) + '\n```\n');
    if (!text.trim()) throw err('empty_completion', 'No answer came back.');
    return { text, truncated:false };
  }
  call.json = async (input, opts = {}) => {
    const { text } = await call(input, opts);
    const t = text.trim(), fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    for (const c of [t, fence && fence[1], t.slice(Math.min(...[t.indexOf('['), t.indexOf('{')].filter(i => i >= 0)), Math.max(t.lastIndexOf(']'), t.lastIndexOf('}')) + 1)]){
      if (!c) continue;
      try { return JSON.parse(c); } catch {}
    }
    throw err('invalid_json', 'The reply wasn’t JSON.', text);
  };
  call.limits = async () => ({ maxPromptBytes: 262144 });
  return call;
}

async function connectServer(url){
  const base = url.trim().replace(/\/+$/, '');
  const r = await fetch(base + '/v1/status');
  if (!r.ok) throw new Error('status ' + r.status);
  return r.json();
}

/* ============ storage ============ */
const S = { profile:{ memory:[], memOn:true }, chats:[], projects:[], pchats:[], docs:[], sources:[] };
const COLLS = ['chats','projects','pchats','docs','sources'];
const LS_KEY = 'akira.v1';
let mode = 'loading', root = null, sample = null, downloads = null;

async function boot(){
  const c = window.claude;
  try {
    const [db, user, smp, dl] = c ? await Promise.all([c.use('db'), c.use('user'), c.use('sample'), c.use('downloads')]) : [null, null, null, null];
    sample = smp; downloads = dl;
    backend = sample ? 'claude' : null;
    const id = user ? await user.id() : null;
    if (db && id){
      root = db.doc(`data/users/${id}/profile`);
      const p = await root.get();
      if (p.exists) S.profile = { ...S.profile, ...p.data() };
      for (const k of COLLS){
        const q = await root.collection(k).get();
        S[k] = q.docs.map(d => ({ ...d.data(), id: d.id }));
      }
      mode = 'account';
    }
  } catch (e) { root = null; }
  if (mode !== 'account'){
    try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch {}
    mode = 'browser';
  }
  if (!sample && serverURL()){ sample = akiraServer(serverURL()); backend = 'akira'; }
  applyPrefs();
  render();
}

let lsTimer;
function saveLocal(){
  clearTimeout(lsTimer);
  lsTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
    catch { toast('This browser is out of space. Remove some sources to keep saving.'); }
  }, 300);
}
const writing = {};
function save(coll, id){
  if (mode === 'browser') return saveLocal();
  if (mode !== 'account') return;
  const key = coll ? coll + '/' + id : 'profile';
  if (writing[key]){ writing[key].again = true; return; }
  writing[key] = { again:false };
  (async () => {
    try {
      if (!coll) await root.set(JSON.parse(JSON.stringify(S.profile)));
      else {
        const obj = S[coll].find(x => x.id === id);
        if (obj){ const { id: _, ...body } = obj; await root.collection(coll).doc(id).set(JSON.parse(JSON.stringify(body))); }
      }
    } catch (e) { saveError(e); }
    const again = writing[key].again; delete writing[key];
    if (again) save(coll, id);
  })();
}
function remove(coll, id){
  S[coll] = S[coll].filter(x => x.id !== id);
  if (mode === 'browser') return saveLocal();
  if (mode === 'account') root.collection(coll).doc(id).delete().catch(saveError);
}
function saveError(e){
  const c = e && e.code;
  if (c === 'quota_exceeded' || c === 'invalid_argument') toast('Couldn’t save: this item is too large. Try a shorter document or source.');
  else toast('Couldn’t save that change. Check your connection and try again.');
}

/* ============ state ============ */
const state = { space:'akira', view:'main', setTab:'general', newKind:'chat', searchAI:null, chat:null, project:null, tab:'overview', pchat:null, doc:null, rel:null, relQ:'', inspector: window.innerWidth > 1180, busy:null };
const proj = () => S.projects.find(p => p.id === state.project);
const DEFAULT_PREFS = { theme:'system', enterSends:true, fhp:true, routeLabels:true, model:'auto', shareRelated:true, dictLang:(navigator.language || 'en-US') };
const prefs = () => (S.profile.prefs = { ...DEFAULT_PREFS, ...(S.profile.prefs || {}) });
function setPref(k, v){ prefs()[k] = v; save(null); applyPrefs(); render(); }
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyPrefs(){
  const t = prefs().theme, de = document.documentElement;
  if (t === 'system'){ if (hostTheme) de.setAttribute('data-theme', hostTheme); else de.removeAttribute('data-theme'); }
  else de.setAttribute('data-theme', t);

function names(t){
  const out = [], toks = t.split(/\s+/);
  for (let i = 1; i < toks.length; i++){
    const w = toks[i].replace(/[^\w’'-]/g, '').replace(/(’|')s$/, '');
    if (/^[A-Z][a-z’'-]{1,}$/.test(w) && !CAPSTOP.has(w) && !/[.!?]$/.test(toks[i-1]) && !out.includes(w)) out.push(w);
  }
  return out.slice(0, 3);

function evalMath(expr){
  const src = expr.replace(/,/g, '').replace(/(\d)\s*x\s*(?=[\d(])/gi, '$1*').replace(/×/g, '*').replace(/÷/g, '/').replace(/\^/g, '**').replace(/\s+/g, '');
  let i = 0;
  const peek = () => src[i];
  const num = () => { const m = src.slice(i).match(/^\d*\.?\d+(e[+-]?\d+)?/i); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  const post = v => { if (peek() === '%'){ i++; return v / 100; } return v; };
  const factor = () => { if (peek() === '-'){ i++; return -factor(); } if (peek() === '+'){ i++; return factor(); } if (peek() === '('){ i++; const v = sum(); if (src[i++] !== ')') throw 0; return post(v); } return post(num()); };
  const power = () => { const b = factor(); if (src.slice(i, i+2) === '**'){ i += 2; return Math.pow(b, power()); } return b; };
  const term = () => { let v = power(); while ((peek() === '*' && src[i+1] !== '*') || peek() === '/'){ const op = src[i++]; const r = power(); v = op === '*' ? v * r : v / r; } return v; };
  const sum = () => { let v = term(); while (peek() === '+' || peek() === '-'){ const op = src[i++]; const r = term(); v = op === '+' ? v + r : v - r; } return v; };
  const v = sum(); if (i !== src.length) throw 0; return v;
}
function calcLocal(t){

  const m = s.match(/^(\d[\d,]*(?:\.\d+)?)\s*%\s*of\s*(\d[\d,]*(?:\.\d+)?)$/);
  if (m){ const a = +m[1].replace(/,/g,''), b = +m[2].replace(/,/g,''); return { expr:`${m[1]}% of ${m[2]}`, value:a * b / 100 }; }
  if (!/^[\d\s+\-*/().,%^×÷x]+$/.test(s) || !/\d/.test(s) || !/[+\-*/^×÷x%]/.test(s.replace(/^-/, ''))) return null;

  try { const v = evalMath(s); return isFinite(v) ? { expr:s, value:v } : null; } catch { return null; }
}

const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseSearch(q){
  let s = ' ' + q.toLowerCase().replace(/[“”"?.!,]/g, ' ') + ' ';
  const f = { kind:null, from:0, to:Infinity, labels:[], terms:[] };
  const day0 = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
  const today = day0(Date.now()), D = 864e5;
  const take = (re, fn) => { const m = s.match(re); if (m){ fn(m); s = s.replace(m[0], ' '); return true; } return false; };
  take(/\b(images?|pictures?|drawings?|posters?|logos?|art|arc)\b/, () => { f.kind = 'image'; f.labels.push(['image','Images']); })
  || take(/\b(code|coding|programming|scripts?|functions?|una)\b/, () => { f.kind = 'code'; f.labels.push(['code','Code']); })
  || take(/\b(research|reports?|briefs?|deep dives?)\b/, () => { f.kind = 'research'; f.labels.push(['search','Research']); });
  const range = (a, b, label) => { f.from = a; f.to = b; f.labels.push(['clock', label]); };
  take(/\btoday\b/, () => range(today, Infinity, 'Today'))
  || take(/\byesterday\b/, () => range(today - D, today, 'Yesterday'))
  || take(/\b(past|last) (\d+) days\b/, m => range(today - (+m[2]) * D, Infinity, `Past ${m[2]} days`))
  || take(/\b(\d+) days ago\b/, m => range(today - (+m[1]) * D, today - (+m[1] - 1) * D, `${m[1]} days ago`))
  || take(/\b(this|past) week\b/, () => { const wd = (new Date().getDay() + 6) % 7; range(today - wd * D, Infinity, 'This week'); })
  || take(/\blast week\b/, () => { const wd = (new Date().getDay() + 6) % 7, start = today - wd * D; range(start - 7 * D, start, 'Last week'); })
  || take(/\bthis month\b/, () => { const d = new Date(); range(new Date(d.getFullYear(), d.getMonth(), 1).getTime(), Infinity, 'This month'); })
  || take(/\blast month\b/, () => { const d = new Date(); range(new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime(), new Date(d.getFullYear(), d.getMonth(), 1).getTime(), 'Last month'); })
  || take(/\b(recent(ly)?|lately|the other day)\b/, () => range(today - 7 * D, Infinity, 'Recently'))
  || take(new RegExp('\\b(on |last )?(' + DAYS.join('|') + ')\\b'), m => { const want = DAYS.indexOf(m[2]); let back = (new Date().getDay() - want + 7) % 7; if (m[1] && m[1].trim() === 'last' && back === 0) back = 7; const a = today - back * D; range(a, a + D, m[2][0].toUpperCase() + m[2].slice(1)); })
  || take(new RegExp('\\b(in )?(' + MONTHS.join('|') + ')\\b'), m => { const mi = MONTHS.indexOf(m[2]), d = new Date(); let y = d.getFullYear(); if (mi > d.getMonth()) y--; range(new Date(y, mi, 1).getTime(), new Date(y, mi + 1, 1).getTime(), m[2][0].toUpperCase() + m[2].slice(1)); });
  s = s.replace(/\b(show|find|search|look|list|get|me|my|the|a|an|all|any|chats?|conversations?|messages?|threads?|from|about|on|in|where|when|i|we|you|asked|talked|said|discussed|wrote|made|did|was|were|that|with|regarding|related|to|for|of|ones?|stuff|things?)\b/g, ' ');
  f.terms = terms(s);
  if (f.terms.length) f.labels.push(['tag', f.terms.join(' ')]);
  return f;
}
function searchChats(q){
  const f = parseSearch(q);
  let list = S.chats.filter(c => (!f.kind || (c.kind || 'chat') === f.kind) && (c.created || c.updated) < f.to && c.updated >= f.from);
  if (f.terms.length){
    list = list.map(c => {
      const tl = c.title.toLowerCase(), xl = c.msgs.map(m => m.content).join('\n').toLowerCase();
      let score = 0, hits = 0;
      f.terms.forEach(w => { const stem = w.length > 4 ? w.replace(/(ing|ed|es|s)$/, '') : w; const a = tl.includes(stem), b = xl.includes(stem); if (a || b){ hits++; score += (a ? 3 : 0) + (b ? 1 : 0); } });
      return { c, score, hits };
    }).filter(x => x.hits).sort((a, b) => b.hits - a.hits || b.score - a.score).map(x => x.c);

  const lines = [...S.chats].sort((a, b) => b.updated - a.updated).slice(0, 80).map(c => `${c.id} | ${KIND[c.kind || 'chat'].name} | ${new Date(c.updated).toDateString()} | ${c.title} | ${preview(c).slice(0, 240).replace(/\s+/g, ' ')}`).join('\n');
  try {
    const ids = await sample.json(`Today is ${new Date().toDateString()}. Find the chats that match this request: "${q}"\n\nChats (id | kind | last active | title | latest text):\n${lines}\n\nReply with only a JSON array of the matching ids, best match first. Reply [] if none match.`, { modelTier:'quick' });
    state.searchAI = { q, busy:false, ids: Array.isArray(ids) ? ids.map(String).filter(id => S.chats.some(c => c.id === id)) : [] };
  } catch (e) { state.searchAI = null; if (e.code !== 'cancelled') toast(errText(e)); }
  renderSidebar();
}

/* Relations & References: entities that link items together */
function entities(space){
  const map = new Map();
  for (const it of corpus(space, true)){
    const key = it.type + ':' + it.id;
    const text = (it.title + '. ' + it.text).slice(0, 80000);
    const re = /\b[A-Z][\w’'-]*(?:\s+[A-Z][\w’'-]*){0,2}/g;
    let m;
    while ((m = re.exec(text))){
      let ws = m[0].split(/\s+/).map(w => w.replace(/(’|')s$/, ''));
      while (ws.length && CAPSTOP.has(ws[0])) ws.shift();
      while (ws.length && CAPSTOP.has(ws[ws.length-1])) ws.pop();
      if (!ws.length) continue;
      const name = ws.join(' ');
      if (name.length < 3 || /^S\d+$/.test(name) || /^\d/.test(name)) continue;
      const lk = name.toLowerCase();
      if (!map.has(lk)) map.set(lk, { name, items:new Map(), count:0 });
      const e = map.get(lk); e.count++;
      if (!e.items.has(key)) e.items.set(key, { ...it, first: m.index - it.title.length - 2 });
    }
  }
  return [...map.values()].filter(e => e.items.size >= 2 || e.count >= 3).sort((a, b) => b.items.size - a.items.size || b.count - a.count).slice(0, 80);
}

function preview(c){ const last = [...c.msgs].reverse().find(m => m.content); return last ? last.content.replace(/```[\s\S]*?(```|$)/g, ' ').replace(/\*\*|[#`>\n]+/g,' ').replace(/\s+/g,' ').trim() || 'Image' : 'New chat'; }
function projSummary(p){ const n = pSources(p.id).length, t = (p.tasks||[]).filter(x => !x.done).length; return `${n} source${n===1?'':'s'} · ${t} open task${t===1?'':'s'}`; }

function routePill(m, i, ctx){
  if (!m.route) return '';
  const w = WHERE[m.route.where] || WHERE.cloud;
  return `<button class="route" data-act="why" data-ctx="${ctx}" data-i="${i}" aria-label="Why Akira chose this"><i style="background:${routeColor(m.route)}"></i>${esc(routeLabel(m.route))} · ${ic(w.icon)}${w.label}</button>`;
}
function refsHTML(refs){
  if (!refs || !refs.length) return '';
  return `<div class="refs"><span>References</span>${refs.map(r => `<button class="ref" data-act="openRef" data-type="${r.type}" data-id="${r.id}">${ic(TYPE[r.type].icon)}<span>${esc(r.label ? r.label + ' · ' + r.title : r.title)}</span></button>`).join('')}</div>`;
}
function msgHTML(m, i, ctx){
  if (m.role === 'user') return `<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>`;
  const body = m.content ? `<div class="md">${arcify(m.content)}</div>` : (m.error || (m.plan && m.plan.phase === 'planning') ? '' : `<div class="typing" aria-label="Akira is thinking"><i></i><i></i><i></i></div>`);
  const pl = m.plan ? `<div class="rplan">${m.plan.phase === 'planning' ? `<h4>${ic('search')}Planning the research…</h4><div class="typing"><i></i><i></i><i></i></div>`
    : `<h4>${ic('search')}${m.plan.phase === 'done' ? `Researched ${m.plan.steps.length} questions` : `Working through ${m.plan.steps.length} questions…`}</h4>${m.plan.steps.map(x => `<div class="rstep ${m.plan.phase === 'done' ? 'done' : ''}">${ic(m.plan.phase === 'done' ? 'check' : 'clock')}<span>${esc(x)}</span></div>`).join('')}`}</div>` : '';
  const acts = (m.actions || []).map((a, j) => {
    const undo = `<button class="link" data-act="undoAction" data-ctx="${ctx}" data-i="${i}" data-j="${j}">${a.kind === 'memory' ? 'Forget' : 'Undo'}</button>`;
    if (a.kind === 'memory') return `<div class="note ${a.undone?'gone':''}">${ic('brain')}Remembered: ${esc(a.text)}${a.undone ? '' : undo}</div>`;
    if (a.kind === 'task') return `<div class="note ${a.undone?'gone':''}">${ic('check')}Added task: ${esc(a.text)}${a.undone ? '' : undo}</div>`;
    if (a.kind === 'doc') return `<div class="note ${a.undone?'gone':''}">${ic('doc')}Created document: ${esc(a.text)}${a.undone ? '' : `<button class="link" data-act="openDoc" data-id="${a.ref}">Open</button>${undo}`}</div>`;
    return '';
  }).join('');
  const cta = m.liveCta ? `<div class="btns"><button class="btn primary" data-act="live">${ic('wave')}Preview Live and Cast</button></div>` : '';
  const err = m.error ? `<div class="err" role="alert">${esc(m.error)}</div>` : '';
  return `<div class="msg" id="${ctx}-m${i}"><span class="av">${ic('spark')}</span><div class="reply"><span class="who">Akira ${routePill(m, i, ctx)}</span>${pl}${body}${acts}${refsHTML(m.refs)}${cta}${err}</div></div>`;
}

function relationsHTML(space){
  const ents = entities(space);
  const scope = space === 'akira' ? 'chats and memory' : 'sources, documents, tasks and conversations';
  if (!ents.length) return `<div class="empty"><b>Nothing connected yet</b><p>As names, places and projects come up in more than one of your ${scope}, Akira links them here.</p></div>`;
  const q = state.relQ.toLowerCase();
  const shown = ents.filter(e => !q || e.name.toLowerCase().includes(q));
  const sel = ents.find(e => e.name === state.rel) || ents[0];
  const items = [...sel.items.values()];
  const co = new Map();
  ents.forEach(e => { if (e === sel) return; let n = 0; e.items.forEach((_, k) => { if (sel.items.has(k)) n++; }); if (n) co.set(e.name, n); });
  const coList = [...co.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
  // radial graph
  const W = 440, H = 290, cx = W/2, cy = 132, nodes = items.slice(0, 8);
  const pos = nodes.map((_, i) => { const a = -Math.PI/2 + i * 2 * Math.PI / Math.max(nodes.length, 1); return [cx + Math.cos(a) * 160, cy + Math.sin(a) * 92]; });
  const svg = `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sel.name)} is connected to ${items.length} items">
    ${pos.map(p => `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`).join('')}
    ${nodes.map((it, i) => `<g data-act="openRef" data-type="${it.type}" data-id="${it.id}"><title>${esc(TYPE[it.type].name + ': ' + it.title)}</title><circle cx="${pos[i][0].toFixed(1)}" cy="${pos[i][1].toFixed(1)}" r="15" style="fill:${TYPE[it.type].color}"/><text class="nt" x="${pos[i][0].toFixed(1)}" y="${(pos[i][1]+3.5).toFixed(1)}" text-anchor="middle">${esc(it.label || TYPE[it.type].n)}</text><text x="${pos[i][0].toFixed(1)}" y="${(pos[i][1]+29).toFixed(1)}" text-anchor="middle">${esc(trunc(it.title, 18))}</text></g>`).join('')}
    <circle cx="${cx}" cy="${cy}" r="38" style="fill:var(--tint)"/><text class="ct" x="${cx}" y="${cy+4.5}" text-anchor="middle">${esc(trunc(sel.name, 11))}</text>
  </svg>`;
  return `<div class="rel">
    <div class="panel rel-list"><input class="input" id="relQ" type="search" placeholder="Filter" value="${esc(state.relQ)}" aria-label="Filter relations">
      ${shown.map(e => `<button class="ent" data-act="pickRel" data-v="${esc(e.name)}" aria-current="${e === sel}"><b>${esc(e.name)}</b><span>${e.items.size}</span></button>`).join('') || `<p class="muted" style="padding:6px 10px">No matches.</p>`}
    </div>
    <div class="panel">
      <h3>${esc(sel.name)} <span class="stamp">${items.length} connected item${items.length === 1 ? '' : 's'} · ${sel.count} mention${sel.count === 1 ? '' : 's'}</span></h3>
      ${svg}
      ${coList.length ? `<div class="also">Also connected:${coList.map(([n]) => `<button data-act="pickRel" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
      <div class="list">${items.map(it => `<div class="li click" data-act="openRef" data-type="${it.type}" data-id="${it.id}"><span class="file-ic" style="background:${TYPE[it.type].color}">${esc(it.label || TYPE[it.type].n)}</span><div class="li-body"><div class="li-title">${esc(it.title)}</div><div class="snip">${esc(snippet(it, 150))}</div></div><span class="li-meta">${TYPE[it.type].name}</span></div>`).join('')}</div>
    </div></div>`;
}

let fhpTimer, fhpLast = '';
function fhp(){
  clearTimeout(fhpTimer);
  fhpTimer = setTimeout(() => {
    const el = $('#fhp'), t = input.value.trim();
    if (t.length < 3 || state.busy === 'chat' || !prefs().fhp){ el.hidden = true; el.innerHTML = ''; fhpLast = ''; return; }
    const r = plan(t, state.space);
    const w = WHERE[r.where];
    const icons = { person:'person', topic:'tag', time:'clock', app:'device' };
    const html = `<span class="fhp-label">Understanding</span><span class="sig lead"><i style="background:${routeColor(r)}"></i><b>${esc(routeLabel(r))}</b>· ${ic(w.icon)}${w.label}</span>`
      + r.sig.map(s => `<span class="sig">${ic(icons[s.k])}<b>${esc(s.label)}</b></span>`).join('')
      + (r.refs.length ? `<span class="sig">${ic('link')}<b>${r.refs.length} related</b>ready</span>` : '');
    el.hidden = false;
    if (html !== fhpLast){ el.innerHTML = html; fhpLast = html; }
  }, 120);
}

let toastTimer;
function toast(text, undo){
  const l = $('#layer');
  l.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast glass'; t.setAttribute('role','status');
  t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button class="btn">Undo</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  l.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 5000);
}
function sheet(html, wire, cls = ''){
  const l = $('#layer');
  l.querySelector('.scrim')?.remove();
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheet(); });
  l.appendChild(s);
  wire && wire(s);
  (s.querySelector('[autofocus]') || s.querySelector('input,textarea,button'))?.focus();
}
function closeSheet(){ $('#layer .scrim')?.remove(); }
function confirmSheet(title, body, label, onYes){
  sheet(`<h2>${esc(title)}</h2><p>${esc(body)}</p><div class="sheet-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="yes">${esc(label)}</button></div>`,

}

}

/* ============ data actions ============ */
const MAX_SOURCE = 200000;
function addSource(name, text){
  const p = proj(); if (!p || !text.trim()) return;
  const trimmed = text.length > MAX_SOURCE;
  const s = { id: uid(), projectId: p.id, name: name || 'Untitled source', text: trimmed ? text.slice(0, MAX_SOURCE) : text, words: words(text.slice(0, MAX_SOURCE)), trimmed, created: now() };
  S.sources.push(s); save('sources', s.id); touchProject();
  render();
  toast(trimmed ? `Added “${s.name}” (trimmed to the first 200,000 characters)` : `Added “${s.name}”`);
}
async function addFiles(files){
  for (const f of files){
    if (f.size > 5e6){ toast(`“${f.name}” is over 5 MB. Split it into smaller files.`); continue; }
    let text = await f.text();
    if (/\.html?$/i.test(f.name)){ const d = new DOMParser().parseFromString(text, 'text/html'); text = d.body ? d.body.innerText || d.body.textContent : text; }
    if (/\u0000/.test(text.slice(0, 2000))){ toast(`“${f.name}” isn’t a text file. Copy its text and use Paste text instead.`); continue; }
    addSource(f.name, text);
  }
}
function touchProject(){ const p = proj(); if (p){ p.updated = now(); save('projects', p.id); } }
function addTask(title, due, byAkira){
  const p = proj(); const t = { id: uid(), title, due: due || '', done: false, byAkira: !!byAkira, created: now() };
  p.tasks = p.tasks || []; p.tasks.push(t); p.updated = now(); save('projects', p.id); return t;
}
function addDoc(title, body, byAkira){
  const p = proj(); const d = { id: uid(), projectId: p.id, title, body: body || '', byAkira: !!byAkira, created: now(), updated: now() };
  S.docs.push(d); save('docs', d.id); touchProject(); return d;
}

/* ============ answering ============ */
let ctl = null;
const ERR = {
  not_granted: 'Akira needs permission to use cloud intelligence. Allow it from this page’s Permissions menu, then try again.',
  sampling_disabled: 'Cloud intelligence isn’t available for this account.',
  rate_limited: 'You’ve reached a usage limit. Wait a bit, then try again.',
  prompt_too_large: 'That’s too much text at once. Remove some sources or start a new conversation.',
  session_expired: 'Your session expired. Sign in to claude.ai again, then retry.',
};
const errText = e => ERR[e && e.code] || 'Akira couldn’t reach the cloud. Try again.';

function akiraRules(){
  const mem = S.profile.memOn ? S.profile.memory.map(m => '- ' + m.text).join('\n') : '';
  return `You are Akira, a personal assistant for everyday help: questions, reasoning, information, planning, writing and explanations. Be warm, clear and direct, and keep answers as short as the question allows. Use light Markdown (short paragraphs, bullet lists, **bold**), no tables. Never mention Claude or which model you run on; you are Akira.
${backend === 'akira' ? 'You can search the web and read web pages: use them for anything current, specific or that you are unsure of, and link your sources. You' : 'In this web preview you can\'t browse the web, and you'} can't read the user's messages, calendar, contacts, photos or files, or act in other apps. If asked, say so plainly and offer what you can do instead, such as a draft or a checklist.
Today is ${new Date().toDateString()}.
${S.profile.memOn ? `Things the user has asked you to remember:\n${mem || '(nothing yet)'}\nUse them only when relevant. When the user shares a lasting preference or fact about themselves that would help in future chats, call the remember tool with one short fact. Never remember health, financial or password details unless the user explicitly asks.` : 'Memory is off. Do not save or refer to remembered facts.'}`;
}
function projectRules(p){
  const srcs = pSources(p.id), docs = pDocs(p.id);
  let budget = 170000, srcText = '';
  srcs.forEach((s, i) => { const chunk = s.text.slice(0, Math.max(0, budget)); budget -= chunk.length; if (chunk) srcText += `\n=== [S${i+1}] ${s.name} ===\n${chunk}${chunk.length < s.text.length ? '\n[...cut for length]' : ''}\n`; });
  let docText = '', db = 30000;
  docs.forEach(d => { const chunk = (d.body||'').slice(0, Math.max(0, Math.min(6000, db))); db -= chunk.length; docText += `\n--- Document: ${d.title || 'Untitled'} ---\n${chunk}\n`; });
  const tasks = (p.tasks||[]).map(t => `- [${t.done?'x':' '}] ${t.title}${t.due ? ' (due ' + t.due + ')' : ''}`).join('\n');
  return `You are Akira working inside the Workspace project "${p.name}". This is a focused work environment, separate from the user's personal Home chats; you know nothing about them here. Never mention Claude or which model you run on; you are Akira.
Project description: ${p.desc || '(none)'}
Goal: ${p.goal || '(not set)'}
Audience: ${p.audience || '(not set)'}
Rules from the user: ${p.rules || '(none)'}
Today is ${new Date().toDateString()}.

Answer from the project's sources and documents plus general knowledge. When you rely on a source, cite it inline as [S1], [S2] using the numbers below. If the sources don't cover something, say so. Flag conflicts between sources rather than resolving them silently. Use light Markdown, no tables.
When the user asks for tasks or a to-do list, or clearly would benefit, use add_task. When they ask for a draft, outline or write-up to keep, use create_document with the full Markdown text. Briefly say what you added.

Tasks:
${tasks || '(none)'}

Documents:${docText || ' (none)'}

Sources:${srcText || ' (none yet)'}`;
}
function rulesFor(r, space){
  let base = space === 'akira' ? akiraRules() : projectRules(proj());
  if (r.family === 'una') base += `\n\nFor this request Akira is using Una, its coding intelligence (${r.tier}). Give correct, complete code in fenced blocks with a language tag. When fixing a bug, first say in one or two sentences why it failed. Keep explanations tight.`;
  if (r.family === 'arc') base += `\n\nFor this request Akira is using Arc, its visual intelligence (${r.tier}). Arc makes a visual concept as one self-contained SVG: include a viewBox, omit width and height, no scripts, no external images or fonts, no foreignObject, under 7000 characters. Use gradients, layered shapes, light and considered composition${r.tier === 'Max' ? ', with rich detail' : r.tier === 'Lite' ? ', kept simple' : ''}. Reply with one short sentence describing the concept, then the SVG in a \`\`\`svg code block, then one short line suggesting a refinement. When the user asks to change an earlier image, redraw the whole SVG with the change.`;
  if (r.research) base += `\n\nThis is a Research chat. For a new question, write a structured research brief in Markdown: "## Summary" (3–4 sentences), "## Key findings" (bullets), then one "##" section per sub-question, then "## Open questions" and "## What to verify". For follow-ups, answer in the same careful style but shorter unless asked. ${backend === 'akira' ? 'Search the web for current facts and cite your sources as links.' : 'Your knowledge comes from training data and you can\'t browse the web here, so flag anything time-sensitive or uncertain.'}${r.steps && r.steps.length ? '\nSub-questions to cover, in order:\n' + r.steps.map((x, i) => `${i+1}. ${x}`).join('\n') : ''}`;
  if (space === 'akira' && r.refs.length) base += '\n\nRelated items the Local Access Center found on this device. Use them if relevant, and say which one you used:\n' + r.refs.map(x => `- ${TYPE[x.type].name} “${x.title}”: ${snippet(x, 600)}`).join('\n');
  return base;
}

function localReply(r, text, space){
  const reply = { role:'assistant', route: routeOf(r), refs: [] };
  const L = r.local, sig = k => (r.sig.find(s => s.k === k) || {}).label;
  if (L.kind === 'calc') reply.content = `**${L.expr} = ${fmtNum(L.value)}**`;
  else if (L.kind === 'clock'){ const d = new Date(); reply.content = `It’s **${d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}** on **${d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'})}**.`; }
  else if (L.kind === 'search'){
    const q = text.replace(/^(find|search( for)?|show( me)?|look up|list)\s+/i, '').replace(/^what did i (say|ask|write|talk about)\s*/i, '')
      .replace(/\b(my|the|all|any|chats?|conversations?|notes?|memor(y|ies)|projects?|documents?|docs?|sources?|tasks?|about|for|on|related to|that|mention(s|ed|ing)?|where|i|with)\b/gi, ' ').replace(/[?.!]/g, '').replace(/\s+/g, ' ').trim();
    const res = space === 'akira' ? searchChats(text).list.slice(0, 8).map(c => ({ type:'chat', id:c.id, title:c.title })) : q ? related(q, space, 8, true) : corpus(space, true).slice(0, 8);
    reply.refs = res.map(x => ({ type:x.type, id:x.id, title:x.title, label:x.label }));
    reply.content = res.length ? `Found ${res.length} item${res.length > 1 ? 's' : ''}${q ? ` for “${q}”` : ''} on this device.` : `Nothing on this device matches “${q}”.`;
  } else if (L.kind === 'app'){
    const who = sig('person'), topic = sig('topic'), time = sig('time');
    reply.content = `I’d look in **${L.app}**${who ? ` for **${who}**` : ''}${topic ? ` about **${topic}**` : ''}${time ? `, around **${time}**` : ''}. In the Akira app, the Local Access Center answers this on your device without using the cloud.\n\n${L.app} isn’t connected in this web preview, so there’s nothing for me to read here yet.${/Messages|Mail/.test(L.app) ? ' I can help you draft a reply if you tell me what it said.' : ''}`;
  } else if (L.kind === 'soon'){
    const f = FAMILIES[r.family];
    reply.content = `That’s a job for **${f.name}**: ${f.role.toLowerCase()} ${f.name} arrives with the Akira app. This web preview can’t use your microphone or camera.`;
    reply.liveCta = true;
  }
  return reply;
}
const routeOf = r => ({ family:r.family, tier:r.tier, where:r.where, why:r.why, local:r.local ? { kind:r.local.kind } : null });

async function ask(convo, r, space, tools, ctxKey){
  const history = convo.msgs.filter(m => m.content && !m.error).slice(-30).map(m => ({ role: m.role, content: m.content }));
  while (history.length && history[0].role !== 'user') history.shift();
  const reply = { role:'assistant', content:'', actions:[], route: routeOf(r), refs: space === 'akira' ? r.refs.map(x => ({ type:x.type, id:x.id, title:x.title, label:x.label })) : [] };
  convo.msgs.push(reply);
  const idx = convo.msgs.length - 1;
  state.busy = 'chat'; render(); scrollEnd();
  ctl = new AbortController();
  let raf = 0;
  const paint = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const el = document.getElementById(`${ctxKey}-m${idx}`);
      if (el) el.outerHTML = msgHTML(reply, idx, ctxKey);
      nearBottom() && scrollEnd();
    });
  };
  const opts = { signal: ctl.signal, modelTier: BACKEND[r.tier] || 'default', onText: ({ text }) => { reply.content = text; paint(); } };
  if (backend === 'akira') opts.akira = { family: r.family, tier: r.tier };
  const tl = tools(reply);
  if (tl.length) opts.tools = tl; else opts.cache = false;
  try {
    if (r.research && convo.msgs.filter(m => m.role === 'user').length === 1){
      reply.plan = { steps:[], phase:'planning' }; paint();
      try {
        const steps = await sample.json(`You are planning research for Akira. Request: "${history[history.length-1].content}". Reply with only a JSON array of 4 to 6 short, specific sub-questions (strings) that together answer it well.`, { modelTier:'quick', signal: ctl.signal });
        reply.plan.steps = (Array.isArray(steps) ? steps : []).slice(0, 6).map(x => String(x).slice(0, 180));
      } catch (e) { if (e && e.code === 'cancelled') throw e; }
      if (!reply.plan.steps.length) delete reply.plan; else reply.plan.phase = 'writing';
      r.steps = reply.plan ? reply.plan.steps : [];
      paint();
    }
    const turns = [{ role:'user', content: rulesFor(r, space) + '\n\nReply "Ready." to confirm.' }, { role:'assistant', content:'Ready.' }, ...history];
    let res;
    try { res = await sample(turns, opts); }
    catch (e) {
      if (e && e.code === 'tools_unavailable' && opts.tools){ delete opts.tools; opts.cache = false; res = await sample(turns, opts); }
      else throw e;
    }
    reply.content = res.text;
    if (reply.plan) reply.plan.phase = 'done';
    if (res.truncated) reply.content += '\n\n*(Cut short. Ask me to continue.)*';
  } catch (e) {
    if (e && e.text) reply.content = e.text;
    if (reply.plan && reply.plan.phase === 'planning') delete reply.plan;
    if (!(e && e.code === 'cancelled')) reply.error = errText(e);
    else if (!reply.content) reply.content = '*Stopped.*';
  }
  state.busy = null; ctl = null;
  convo.updated = now();
  render(); nearBottom(240) && scrollEnd();
}
const scrollEnd = () => { const s = $('#scroll'); s.scrollTop = s.scrollHeight; };
const nearBottom = (px = 160) => { const s = $('#scroll'); return s.scrollHeight - s.scrollTop - s.clientHeight < px; };

async function sendMessage(text){
  const space = state.space;
  const r = plan(text, space);
  let c, coll, ctxKey;
  stopDictation();
  if (space === 'akira'){
    c = S.chats.find(x => x.id === state.chat);
    if (!c){ c = { id: uid(), kind: state.newKind || 'chat', title: trunc(text.replace(/\s+/g, ' '), 40), msgs: [], created: now(), updated: now() }; S.chats.push(c); state.chat = c.id; }
    coll = 'chats'; ctxKey = 'c';
  } else {
    const p = proj(); if (!p) return;
    c = S.pchats.find(x => x.id === state.pchat && x.projectId === p.id);
    if (!c){ c = { id: uid(), projectId: p.id, title: trunc(text.replace(/\s+/g, ' '), 40), msgs: [], created: now(), updated: now() }; S.pchats.push(c); state.pchat = c.id; }
    state.tab = 'chat'; coll = 'pchats'; ctxKey = 'p';
  }
  c.msgs.push({ role:'user', content:text }); c.updated = now();
  if (r.local){
    c.msgs.push(localReply(r, text, space));
  } else if (!sample){
    c.msgs.push({ role:'assistant', content:'', route: routeOf(r), error:'This needs the Cloud Access Center, which isn’t connected. Add your Akira server in Settings → Intelligence.' });
  } else if (space === 'akira'){
    await ask(c, r, space, reply => S.profile.memOn && r.family === 'core' && !r.research ? [{
      name: 'remember',
      description: 'Save one short, lasting fact or preference about the user for future Home chats.',
      inputSchema: { type:'object', properties:{ fact:{ type:'string', description:'The fact, under 120 characters, written about the user (e.g. "Prefers trains to flights").' } }, required:['fact'] },
      execute: ({ fact }) => { const m = addMemory(String(fact).slice(0, 160), 'From “' + c.title + '”'); reply.actions.push({ kind:'memory', text:m.text, ref:m.id }); renderSidebar(); return 'Saved.'; }
    }] : [], ctxKey);
  } else {
    await ask(c, r, space, reply => r.family === 'arc' ? [] : [
      { name:'add_task', description:'Add a task to this project.', inputSchema:{ type:'object', properties:{ title:{type:'string'}, due:{type:'string', description:'Optional due date as YYYY-MM-DD'} }, required:['title'] },
        execute: ({ title, due }) => { const t = addTask(String(title).slice(0, 200), /^\d{4}-\d{2}-\d{2}$/.test(due||'') ? due : '', true); reply.actions.push({ kind:'task', text:t.title, ref:t.id }); return 'Task added.'; } },
      { name:'create_document', description:'Create a document in this project with a title and full Markdown body.', inputSchema:{ type:'object', properties:{ title:{type:'string'}, body:{type:'string'} }, required:['title','body'] },
        execute: ({ title, body }) => { const d = addDoc(String(title).slice(0, 200), String(body), true); reply.actions.push({ kind:'doc', text:d.title, ref:d.id }); return 'Document created.'; } }
    ], ctxKey);
    touchProject();
  }
  c.updated = now();
  save(coll, c.id);
  render(); scrollEnd();
}

async function statusUpdate(){
  const p = proj(); if (!p || !sample) return;
  state.busy = 'status'; render();
  try {
    const { text } = await sample(projectRules(p) + '\n\nWrite a short status update for this project: where things stand (2–3 sentences), then "Next" with up to 3 bullets, then any risks or gaps in the sources. Under 140 words. Do not call any tools.', { cache:false, modelTier:'default' });
    p.status = { text, at: now() }; save('projects', p.id);
  } catch (e) { if (e.code !== 'cancelled') toast(errText(e)); }
  state.busy = null; render();
}

  },
  openProject: el => { state.view = 'main'; if (state.project !== el.dataset.id){ state.project = el.dataset.id; state.tab = 'overview'; state.pchat = null; state.doc = null; state.rel = null; } closeDrawer(); render(); $('#scroll').scrollTop = 0; },
  newProject: newProjectSheet,
  tab: el => { state.tab = el.dataset.v; state.doc = null; if (el.dataset.v === 'chat' && !state.pchat) state.pchat = pChats(state.project)[0]?.id || null; render(); },
  newConvo: () => { state.pchat = null; render(); $('#input').focus(); },
  openConvo: el => { state.pchat = el.dataset.id; render(); scrollEnd(); },
  openRef: el => {
    const { type, id } = el.dataset;
    if (type === 'chat'){ if (!S.chats.some(c => c.id === id)) return toast('That chat was deleted.'); state.space = 'akira'; state.view = 'main'; state.chat = id; render(); scrollEnd(); }
    else if (type === 'memory') openSettings('memory');
    else if (type === 'doc') ACT.openDoc(el);
    else if (type === 'source'){ state.tab = 'sources'; state.doc = null; render(); }
    else if (type === 'task'){ state.tab = 'tasks'; state.doc = null; render(); }
    else if (type === 'pchat'){ state.tab = 'chat'; state.pchat = id; state.doc = null; render(); scrollEnd(); }
  },
  ctx: () => { state.inspector = !state.inspector; renderInspector(); },
  color: el => { const p = proj(); p.color = el.dataset.v; p.updated = now(); save('projects', p.id); delete $('#inspector').dataset.pid; render(); },
  delProject: () => {
    const p = proj();
    confirmSheet(`Delete ${p.name}?`, 'Its sources, documents, tasks and conversations will be deleted. This can’t be undone.', 'Delete project', () => {
      S.sources.filter(s => s.projectId === p.id).forEach(s => remove('sources', s.id));
      S.docs.filter(s => s.projectId === p.id).forEach(s => remove('docs', s.id));
      S.pchats.filter(s => s.projectId === p.id).forEach(s => remove('pchats', s.id));
      remove('projects', p.id); state.project = null; delete $('#inspector').dataset.pid; render(); toast('Project deleted');
    });
  },
  toggleTask: el => { const p = proj(), t = p.tasks.find(x => x.id === el.dataset.id); t.done = !t.done; p.updated = now(); save('projects', p.id); render(); },
  delTask: el => {
    const p = proj(), i = p.tasks.findIndex(x => x.id === el.dataset.id), [t] = p.tasks.splice(i, 1);
    save('projects', p.id); render();
    toast('Task deleted', () => { p.tasks.splice(i, 0, t); save('projects', p.id); render(); });
  },
  newDoc: () => { const d = addDoc('', ''); state.doc = d.id; render(); $('#docTitle').focus(); },
  openDoc: el => { const d = S.docs.find(x => x.id === el.dataset.id); if (!d){ toast('That document was removed.'); return; } state.view = 'main'; state.space = 'workspace'; state.project = d.projectId; state.tab = 'docs'; state.doc = d.id; render(); $('#scroll').scrollTop = 0; },
  closeDoc: () => {
    const d = S.docs.find(x => x.id === state.doc);
    if (d && !d.title.trim() && !(d.body||'').trim()) remove('docs', d.id);
    state.doc = null; render();
  },
  delDoc: el => {
    const d = S.docs.find(x => x.id === el.dataset.id);
    confirmSheet('Delete this document?', `“${d.title || 'Untitled'}” will be deleted. This can’t be undone.`, 'Delete', () => { remove('docs', d.id); state.doc = null; render(); toast('Document deleted'); });
  },
  upload: () => $('#fileInput').click(),
  pasteSource: pasteSourceSheet,
  delSource: el => {
    const s = S.sources.find(x => x.id === el.dataset.id);
    confirmSheet('Remove this source?', `Akira will stop using “${s.name}” in this project. Source numbers after it will shift.`, 'Remove', () => { remove('sources', s.id); touchProject(); render(); toast('Source removed'); });
  },
  status: statusUpdate,
  undoAction: el => {
    const list = convoFor(el.dataset.ctx);
    const m = list.msgs[+el.dataset.i], a = m.actions[+el.dataset.j];
    if (a.kind === 'memory'){ S.profile.memory = S.profile.memory.filter(x => x.id !== a.ref); save(null); }
    if (a.kind === 'task'){ const p = proj(); p.tasks = p.tasks.filter(t => t.id !== a.ref); save('projects', p.id); }
    if (a.kind === 'doc'){ remove('docs', a.ref); }
    a.undone = true; save(el.dataset.ctx === 'c' ? 'chats' : 'pchats', list.id); render();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.scrim')) return;
  const f = ACT[el.dataset.act];
  if (f){ e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'relQ'){
    state.relQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const n = $('#relQ'); if (n){ n.focus(); n.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form;
  if (f === 'addTask'){
    e.preventDefault();
    const title = $('#taskTitle').value.trim(); if (!title) return;
    addTask(title, $('#taskDue').value); render(); $('#taskTitle').focus();
  } else if (f === 'memAdd'){
    e.preventDefault();
    const v = $('#memText').value.trim(); if (!v) return;
    addMemory(v, 'Added by you'); render(); $('#memText').focus();
  } else if (f === 'context'){
    e.preventDefault();
    const p = proj();
    p.name = $('#cName').value.trim() || p.name; p.desc = $('#cDesc').value.trim(); p.goal = $('#cGoal').value.trim(); p.audience = $('#cAud').value.trim(); p.rules = $('#cRules').value.trim(); p.updated = now();
    save('projects', p.id); document.activeElement.blur(); delete $('#inspector').dataset.pid; render(); toast('Project context saved');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeSheet(); closeDrawer(); toggleModelMenu(false); } });
document.addEventListener('change', e => { if (e.target.dataset.pref) setPref(e.target.dataset.pref, e.target.value); });
document.addEventListener('click', e => { if (!$('#modelMenu').hidden && !e.target.closest('#modelMenu, #modelBtn')) toggleModelMenu(false); }, true);
$('#q').addEventListener('input', () => { state.searchAI = null; renderSidebar(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && sample && $('#q').value.trim()) askSearch(); });

/* Model menu */
function toggleModelMenu(open){
  const m = $('#modelMenu'), show = open ?? m.hidden;
  if (!show){ m.hidden = true; $('#modelBtn').setAttribute('aria-expanded', 'false'); return; }
  const cur = prefs().model;
  m.innerHTML = [['auto','Auto','Akira picks the best level for each request'],['Standard','Standard','Fastest, for everyday questions'],['Pro','Pro','Reasoning, planning and writing'],['Ultra','Ultra','Most capable, for in-depth work. Slower.']]
    .map(([v, l, d]) => `<button type="button" class="mm-opt" role="menuitemradio" aria-checked="${cur === v}" data-act="pickModel" data-v="${v}"><svg class="i tick"><use href="#i-check"/></svg><div><b>${l}</b><span>${d}</span></div></button>`).join('');
  m.hidden = false; $('#modelBtn').setAttribute('aria-expanded', 'true');
  m.querySelector('[aria-checked="true"]')?.focus();
}

/* Dictation: browser speech recognition, with device dictation as the fallback */
let rec = null;
function setMic(on){ const b = $('#micBtn'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Stop dictation' : 'Dictate'); }
function stopDictation(){ if (rec){ const r0 = rec; rec = null; try { r0.stop(); } catch {} } setMic(false); }
function dictationHelp(reason){
  sheet(`<h2>Dictate with your device</h2><p>${esc(reason)} Your device’s built-in dictation works in Akira’s message box. Put the cursor in the box, then:</p>
    <ul class="why-list"><li><b>Mac:</b> press <kbd>Fn</kbd> twice, or the microphone key</li><li><b>Windows:</b> press <kbd>Windows</kbd> + <kbd>H</kbd></li><li><b>iPhone and iPad:</b> tap the microphone on the keyboard</li><li><b>Android:</b> tap the microphone on the keyboard</li></ul>
    <div class="sheet-foot"><button class="btn primary" data-close id="dictOk">Start typing</button></div>`, s => s.querySelector('#dictOk').addEventListener('click', () => setTimeout(() => input.focus(), 0)));
}
function toggleDictation(){
  if (rec){ stopDictation(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return dictationHelp('This browser doesn’t offer speech recognition to pages.');
  const r0 = new SR();
  r0.lang = prefs().dictLang; r0.interimResults = true; r0.continuous = true;
  const base = input.value ? input.value.replace(/\s*$/, ' ') : '';
  let heard = false;
  r0.onresult = e => { heard = true; let t = ''; for (const x of e.results) t += x[0].transcript; input.value = base + t; syncInput(); };
  r0.onerror = e => {
    const blocked = ['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].includes(e.error);
    stopDictation();
    if (blocked) dictationHelp('The microphone isn’t available to this page.');
    else if (e.error === 'no-speech') toast('Didn’t hear anything. Tap the microphone to try again.');
  };
  r0.onend = () => { if (rec === r0){ rec = null; setMic(false); if (heard) input.focus(); } };
  try { r0.start(); rec = r0; setMic(true); input.focus(); }
  catch { stopDictation(); dictationHelp('Dictation couldn’t start here.'); }
}
$('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

const input = $('#input');
function syncInput(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; if (state.busy !== 'chat') $('#send').disabled = !input.value.trim(); fhp(); }
input.addEventListener('input', syncInput);
input.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (prefs().enterSends || e.metaKey || e.ctrlKey){ e.preventDefault(); $('#composer').requestSubmit(); }
});
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  if (state.busy === 'chat'){ ctl?.abort(); return; }
  const text = input.value.trim();
  if (!text || state.busy) return;
  input.value = ''; syncInput();
  sendMessage(text);
});

applyPrefs();
render();
boot();
</script>
